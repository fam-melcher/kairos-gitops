# Bounds the blast radius of a node operation to one node per pull request.
# No NodeOp/NodeOpUpgrade manifest exists in this repo yet; this must be in
# place before one ever can. See ADR 0013.
name: nodeop-guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  nodeop-guard:
    runs-on: ubuntu-24.04
    # These jobs render and parse; nothing here should take minutes. A bound
    # turns any future non-termination into a red run rather than a job that
    # sits until GitHub's six-hour default kills it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The guards read the merge base: one as each changed file's
          # pre-image, the other as a second worktree to render.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml==6.0.3'

      - uses: ./.github/actions/kustomize

      - name: Check out the merge base
        run: |
          set -euo pipefail
          base="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          git worktree add --detach "${RUNNER_TEMP}/base" "${base}"
          echo "NODEOP_BASE=${base}" >> "${GITHUB_ENV}"
          # The guards that enforce are the merge base's copies, not this pull
          # request's. A pull request edits the scripts it is checked by
          # otherwise, and a self-test cannot notice: it would be the edited
          # guard grading its own edited fixtures. The versions added here take
          # effect on the next pull request, once they are on main.
          #
          # This does not make the job tamper-proof — GitHub runs the workflow
          # file itself, and any local action it calls
          # (.github/actions/kustomize), from the pull request head, so a change
          # to either still decides what runs and what renders it. Only branch
          # protection and CODEOWNERS on .github/** close that, and both live in
          # repository settings (ADR 0013).
          # The merge base's copies are what enforce, and the set they must
          # carry is fixed here rather than derived from this pull request's
          # file list: deriving it lets a pull request that merely *adds* a
          # script declare the merge base incomplete and hand enforcement to
          # its own copies.
          scripts="${RUNNER_TEMP}/base/.github/scripts"
          present=0
          missing=0
          for name in nodeop_common.py nodeop_guard.py nodeop_reachable.py \
                      nodeop_guard_selftest.sh nodeop_reachable_selftest.sh; do
            if [ -f "${scripts}/${name}" ]; then
              present=$((present + 1))
            else
              missing=$((missing + 1))
              echo "the merge base has no ${name}"
            fi
          done
          if [ "${missing}" -ne 0 ] && [ "${present}" -eq 0 ]; then
            # Bootstrap: the merge base predates the guards entirely, so there
            # is no protection to hand over and nothing to subvert. True only
            # until the pull request introducing them lands.
            echo "::warning::the merge base carries no guards at all; this pull request's own will run"
            scripts="${GITHUB_WORKSPACE}/.github/scripts"
          elif [ "${missing}" -ne 0 ]; then
            echo "::error::the merge base carries ${present} of the guard scripts and is missing ${missing}."
            echo "Refusing to enforce with a partial guard, and refusing to fall back to this pull request's copies."
            exit 1
          fi
          echo "NODEOP_SCRIPTS=${scripts}" >> "${GITHUB_ENV}"

      # The repo holds no node operations, so the checks below inspect nothing
      # and pass. These steps are what tell that apart from a guard that has
      # silently stopped detecting: each replays throwaway pull requests
      # against the real guard and asserts its verdict on every one.
      - name: Self-test the enforcing guards
        run: |
          set -euo pipefail
          "${NODEOP_SCRIPTS}/nodeop_guard_selftest.sh"
          "${NODEOP_SCRIPTS}/nodeop_reachable_selftest.sh"

      # And the versions this pull request proposes, so that a change breaking
      # its own guard fails here rather than on the pull request after it.
      # Unconditional: when the merge base is what enforces, this is the only
      # step that exercises the proposed versions at all, and when it is not,
      # running them twice costs seconds.
      - name: Self-test this pull request's guards
        run: |
          set -euo pipefail
          .github/scripts/nodeop_guard_selftest.sh
          .github/scripts/nodeop_reachable_selftest.sh

      # The diff is deliberately unscoped. ArgoCD builds each cluster with
      # kustomize's root-only load restriction, whose root is the repository
      # checkout — so a kustomization under clusters/ can pull a resource from
      # any tracked directory, and a `-- clusters/` filter would miss a
      # manifest parked elsewhere and referenced by one added line.
      - name: Check this pull request's changed files
        run: |
          set -euo pipefail
          git diff --name-status -z --diff-filter=ACMRT -M "${NODEOP_BASE}" HEAD > changes.z
          python3 "${NODEOP_SCRIPTS}/nodeop_guard.py" --changes changes.z --base "${NODEOP_BASE}"

      # What a diff cannot see: a manifest merged earlier that this pull request
      # merely references. This renders the Application closure on both sides
      # and counts what newly reaches a node.
      - name: Check what this pull request makes reachable
        run: |
          set -euo pipefail
          python3 "${NODEOP_SCRIPTS}/nodeop_reachable.py" \
            --base "${RUNNER_TEMP}/base" \
            --head "${GITHUB_WORKSPACE}"
