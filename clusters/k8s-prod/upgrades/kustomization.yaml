apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  # One NodeOpUpgrade is listed here while a round is running, and removed when
  # it is done. The file and the object carry the target version in their name,
  # so a new round is a new object rather than an edit to a finished one
  # (ADR 0014). Empty between rounds — the namespace keeps this build valid.
  - hadron-prod-v0-5-1-k3s-v1-35-8.yaml
