apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: envoy-gateway-system
  annotations:
    # cert-manager derives a Certificate from every listener that has a
    # hostname, tls.mode Terminate and a same-namespace certificateRef —
    # so this covers the https listener and skips http. See ADR 0011.
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Derived from this cluster's own dns value in kairos-configs
      # (clusters/k8s-prod/config/11-cluster.yaml). The wildcard record
      # already resolves to 192.168.30.3 — the single address in this
      # cluster's MetalLB pool (ADR 0006).
      #
      # Wildcard is a suffix match: this accepts foo.k8s-prod.home... but
      # NOT the apex k8s-prod.home..., which would need its own listener
      # entry. The apex currently resolves to the control-plane VIP.
      hostname: "*.k8s-prod.home.fam-melcher.net"
      allowedRoutes:
        namespaces:
          # Governs Route->Gateway attachment only. Cross-namespace
          # backendRefs (and, later, TLS certificateRefs) additionally
          # require a ReferenceGrant in the target's namespace — one reason
          # HTTPRoutes belong alongside the workloads they route to.
          #
          # "All" is appropriate while this address is LAN-only. It means
          # anyone able to create an HTTPRoute in any namespace can publish
          # on this Gateway. Before this address is ever port-forwarded,
          # split internet-facing traffic onto a second Gateway with its own
          # address, an exact (non-wildcard) listener hostname and a
          # restricted allowedRoutes selector — see ADR 0009.
          from: All

    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.k8s-prod.home.fam-melcher.net"
      tls:
        mode: Terminate
        certificateRefs:
          # cert-manager names the Certificate after this Secret and creates
          # both in this namespace. Neither object is in git.
          - kind: Secret
            group: ""
            name: wildcard-k8s-prod-tls
      allowedRoutes:
        namespaces:
          from: All

    # Exact-hostname listener isolating the cluster's own identity issuer
    # from the shared wildcard listeners above. Fix for security-01 BLOCKER
    # #1: any HTTPRoute author in any namespace can attach to the wildcard
    # listeners (from: All) and, without this, could have attached a
    # more-specific route for this same hostname and won Gateway API's route
    # precedence, hijacking the Keycloak login/token endpoints. A dedicated
    # Gateway object was rejected (needs its own MetalLB address; ADR 0006
    # explicitly defers that to the internet-facing-split case, not this).
    # `from: Same` was also rejected: "Same" means the Gateway's own
    # namespace (envoy-gateway-system), not Keycloak's, which would force
    # the HTTPRoute out of its workload's namespace. See
    # opencode/agents/reports/architect-02.md.
    - name: keycloak
      protocol: HTTPS
      port: 443
      hostname: "keycloak.k8s-prod.home.fam-melcher.net"
      tls:
        mode: Terminate
        certificateRefs:
          # Distinct from wildcard-k8s-prod-tls — cert-manager derives its
          # own Certificate/Secret pair per listener with a hostname (ADR
          # 0011). Neither object is in git.
          - kind: Secret
            group: ""
            name: keycloak-tls
      allowedRoutes:
        namespaces:
          # The auto-populated kubernetes.io/metadata.name label needs no
          # coordination with however keycloak-operator/keycloak-config end
          # up shipping the namespace object — it always exists. This is the
          # actual admission control; non-wildcard hostnames already rank
          # above the wildcard listener in Gateway API's own precedence
          # rules regardless, but Selector is what stops a hostile
          # namespace's Route from attaching to this listener at all.
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
