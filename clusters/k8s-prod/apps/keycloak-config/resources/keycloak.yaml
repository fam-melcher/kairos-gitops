apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1
  # Default is true (verified against the fetched keycloaks.k8s.keycloak.org
  # CRD schema — its description states plainly the deployment is "by
  # default, exposed through a basic ingress"). This repo's own HTTPRoute
  # (resources/httproute.yaml) replaces it, per ADR 0009. See
  # opencode/agents/reports/keycloak-01.md §4.
  ingress:
    enabled: false
  # Hostname the apiserver's --oidc-issuer-url and this repo's HTTPRoute
  # both target.
  hostname:
    hostname: keycloak.k8s-prod.home.fam-melcher.net
  # Fixes a post-merge outage: without this, http.httpEnabled defaults to
  # false, so the operator only opens an HTTPS listener (self-signed cert,
  # port 8443) on the pod/Service — nothing listens on port 8080, which is
  # what resources/httproute.yaml's backendRef targets. Envoy Gateway then
  # gets a connection refused/reset trying to reach a port nothing serves
  # ("upstream connect error ... remote connection failure"). TLS is
  # already terminated once, at the Gateway's dedicated Keycloak listener
  # (cert-manager/Let's Encrypt) — this avoids re-terminating TLS a second
  # time at the pod, which would need a BackendTLSPolicy this repo has no
  # other precedent for. httpPort left at its default (8080), matching the
  # HTTPRoute's existing backendRef port.
  http:
    httpEnabled: true
  db:
    vendor: postgres
    host: cnpg-keycloak-rw.keycloak.svc
    usernameSecret:
      name: cnpg-keycloak-app
      key: username
    passwordSecret:
      name: cnpg-keycloak-app
      key: password
  # Hand-applied before first sync — no secret-management tooling exists in
  # this repo (see opencode/human/DESIGN.md §4). Confirmed field name
  # against the fetched CRD schema (opencode/agents/reports/keycloak-01.md
  # §7).
  bootstrapAdmin:
    user:
      secret: keycloak-bootstrap-admin
