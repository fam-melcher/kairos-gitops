apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fam-melcher-k8s-admins
subjects:
  # Confirmed live: the realm's Group Membership mapper has "Full group
  # path" ON, so the groups claim carries "/k8s-admins", not "k8s-admins".
  # Kubernetes' Group subject match is exact-string, so this must carry the
  # leading slash to match.
  - kind: Group
    name: /k8s-admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fam-melcher-k8s-users
subjects:
  - kind: Group
    name: /k8s-users
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
