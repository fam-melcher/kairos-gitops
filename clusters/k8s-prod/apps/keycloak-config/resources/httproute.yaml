apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  # Attaches to the new exact-hostname listener added to `main` in
  # opencode/human/patches/ (security-01 BLOCKER #1 fix, DESIGN.md §2) — not
  # the shared wildcard listener. The listener's own Selector
  # (kubernetes.io/metadata.name: keycloak) is what prevents any other
  # namespace's HTTPRoute from ever attaching here; nothing on this object
  # enforces that boundary itself.
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
  hostnames:
    - keycloak.k8s-prod.home.fam-melcher.net
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
