apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ceph-csi-rbd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Helm rather than deploy/rbd/kubernetes: those manifests hardcode
    # `namespace: default` and omit two of the three ConfigMaps the node
    # plugin mounts. See ADR 0010.
    repoURL: https://ceph.github.io/csi-charts
    chart: ceph-csi-rbd
    # targetRevision and helm.values intentionally absent — supplied per
    # cluster by clusters/<name>/apps/ceph-csi-rbd/version-patch.yaml.
    helm:
      releaseName: ceph-csi-rbd
  destination:
    server: https://kubernetes.default.svc
    namespace: ceph-csi-rbd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The chart ships no Namespace of its own.
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # csi-rbdplugin is privileged with hostPID and bidirectional mount
        # propagation. No-op under k3s today; keeps the driver working if
        # PodSecurity is ever enforced.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
