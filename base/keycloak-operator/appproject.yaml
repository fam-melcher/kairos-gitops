apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: keycloak-operator
  namespace: argocd
spec:
  description: keycloak-operator's upstream install manifests, and nothing else.
  sourceRepos:
    - https://github.com/keycloak/keycloak-k8s-resources
  destinations:
    - server: https://kubernetes.default.svc
      namespace: keycloak
  # TODO(verifier): this list is derived from
  # opencode/agents/reports/keycloak-01.md's direct fetch of kubernetes.yml
  # (ServiceAccount, ClusterRoles, ClusterRoleBinding, RoleBindings, Service,
  # Deployment) plus the three CRD files that ship alongside it
  # (keycloaks.k8s.keycloak.org, keycloakrealmimports.k8s.keycloak.org, and a
  # third CRD the kustomization.yml lists but whose exact kind name was not
  # captured in this design round). Re-measure against the actual rendered
  # `kustomize build` output for tag 26.7.4 before merge, exactly as ADR 0013
  # measured kairos-operator's — do not assume this list is complete.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  # No roles: nothing needs a project token.
