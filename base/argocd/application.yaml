apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Deliberately not "argocd": clusters/<name>/argocd.yaml (the app-of-apps
  # pointer root discovers) already uses that name for the SAME
  # apiVersion/kind/namespace. Sharing a name there means both objects are
  # the same Kubernetes resource — whichever synced last stomps the
  # other's spec, causing this Application to alternate between "my only
  # child is the pointer's one Application object" (prunes every real
  # ArgoCD resource) and "my child is the actual Helm release" on every
  # reconcile. Distinct identity is required, not just tidiness.
  name: argocd-release
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    # targetRevision intentionally absent — supplied per cluster by
    # clusters/<name>/apps/argocd/version-patch.yaml. This file alone is
    # not a valid, deployable Application.
    helm:
      releaseName: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
