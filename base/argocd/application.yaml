apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Named plainly "argocd" — root owns this Application directly
  # (ADR 0005). An earlier shape had root pointing at a separate 1-to-1
  # pointer Application that also had to be named "argocd", forcing this
  # one into "argocd-release" to avoid a name collision. That extra
  # indirection didn't match ArgoCD's documented App of Apps pattern
  # (one parent, multiple direct real children) and is gone now, so is
  # the workaround name.
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Argo CD's own official manifests, not the separate argo-helm
    # community chart — matches ArgoCD's documented self-management
    # example exactly (manifests/cluster-install, a Kustomize directory:
    # namespace-install + cluster-rbac + crds). Bootstrap
    # (kairos-configs/configs/roles/16-argocd.yaml) applies this same
    # project's manifests/install.yaml. Two different packaging projects
    # for the same app (community Helm chart vs. upstream manifests) can
    # wire up shared components differently — confirmed in practice: the
    # argo-helm chart's redis Deployment ran its secret-init container
    # under the "default" ServiceAccount with no secret-create RBAC,
    # while manifests/base/redis ships its own dedicated
    # ServiceAccount+Role+RoleBinding for exactly that. Using the same
    # source for both bootstrap and self-management removes the seam.
    repoURL: https://github.com/argoproj/argo-cd
    path: manifests/cluster-install
    # targetRevision intentionally absent — supplied per cluster by
    # clusters/<name>/apps/argocd/version-patch.yaml. This file alone is
    # not a valid, deployable Application.
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Required when Argo CD manages itself (verified against
      # https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/,
      # not assumed) — some of its own CRDs exceed client-side apply's
      # 262KB last-applied-configuration annotation limit.
      - ServerSideApply=true
